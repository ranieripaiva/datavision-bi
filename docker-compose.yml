services:
  db:
    image: postgres:16-alpine
    container_name: datavision-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: datavision
      POSTGRES_USER: datavision
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - datavision_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datavision -d datavision"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    container_name: datavision-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://datavision:${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}@db:5432/datavision?schema=public
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env}
      PORT: 3001
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    container_name: datavision-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  datavision_data:
